<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Your Queue Token - QueueFlow</title><link rel="stylesheet" href="style.css"></head><body>
<header class="header"><div class="logo"><div class="logo-box">Q</div><div><h1>QueueFlow</h1><small>Digital Queue Management</small></div></div><nav><a href="index.html">Home</a><a href="status.html">Check Status</a><a href="login.html">Admin Login</a></nav></header>
<main class="token-page"><section class="card token-card"><div class="success-icon">✓</div><p class="token-label">TOKEN GENERATED</p><h1>Your Token Number</h1><div class="token-number" id="tokenNumber">Loading...</div><div class="token-details"><div class="detail-box"><span>Name</span><strong id="tokenName">Loading...</strong></div><div class="detail-box"><span>Service</span><strong id="tokenService">Loading...</strong></div><div class="detail-box"><span>Status</span><strong id="tokenStatus">Waiting</strong></div><div class="detail-box"><span>People Ahead</span><strong id="peopleAhead">0</strong></div></div><div class="token-message">Please remember your token number. You can check your queue status anytime.</div><div class="token-actions"><button class="btn primary" id="statusBtn">Check Queue Status</button><a class="btn secondary" href="index.html">Get Another Token</a></div><p id="errorMessage" class="error-message"></p></section></main>
<script>
const id=new URLSearchParams(location.search).get("id"),error=document.getElementById("errorMessage");let currentTokenNumber="";
async function loadToken(){if(!id){error.textContent="Invalid token ID. Please generate a new token.";return}try{const r=await fetch("/api/tokens/"+encodeURIComponent(id));const d=await r.json();if(!r.ok)throw new Error(d.message||"Token not found");const t=d.token;currentTokenNumber=t.tokenNumber;document.getElementById("tokenNumber").textContent=t.tokenNumber;document.getElementById("tokenName").textContent=t.name;document.getElementById("tokenService").textContent=t.serviceName;document.getElementById("tokenStatus").textContent=t.status.charAt(0).toUpperCase()+t.status.slice(1);document.getElementById("peopleAhead").textContent=t.peopleAhead;error.textContent=""}catch(e){error.textContent="Unable to load token details: "+e.message}}
document.getElementById("statusBtn").addEventListener("click",()=>{if(id)location.href=`status.html?token=${encodeURIComponent(currentTokenNumber)}`});loadToken();setInterval(loadToken,5000);
</script></body></html>
