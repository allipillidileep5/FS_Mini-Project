<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Admin Dashboard - QueueFlow</title><link rel="stylesheet" href="style.css"></head><body>
<header class="header"><div class="logo"><div class="logo-box">Q</div><div><h1>QueueFlow</h1><small>Admin Dashboard</small></div></div><nav><a href="index.html">Home</a><a href="status.html">Status</a><a class="active" href="admin.html">Admin</a><a href="services.html">Services</a><a href="#" id="logoutLink">Logout</a></nav></header>
<main class="admin-page"><div class="section-heading"><small>ADMIN PANEL</small><h1>Queue Dashboard</h1></div>
<div class="card admin-controls"><label for="serviceSelect">Select Service</label><select id="serviceSelect"><option value="">Select service</option></select><button class="btn primary" id="nextBtn">CALL NEXT TOKEN →</button></div>
<div class="admin-grid"><div class="card current-admin"><small>NOW SERVING</small><div class="admin-token" id="currentToken">---</div><h3 id="currentName">No token</h3><p id="currentService">Select a service</p></div>
<div class="card"><small>TODAY'S STATISTICS</small><div class="admin-stats"><div><span>Total</span><strong id="total">0</strong></div><div><span>Waiting</span><strong id="waiting">0</strong></div><div><span>Serving</span><strong id="serving">0</strong></div><div><span>Completed</span><strong id="completed">0</strong></div><div><span>Cancelled</span><strong id="cancelled">0</strong></div><div><span>Skipped</span><strong id="skipped">0</strong></div></div></div></div>
<div class="card queue-card"><div class="queue-header"><div><small>WAITING QUEUE</small><h2>Customers</h2></div><span id="queueCount">0 waiting</span></div><div id="queueList"><p>Select a service to view queue.</p></div></div></main>
<script>
const select=document.getElementById("serviceSelect"),list=document.getElementById("queueList");
async function loadServices(){try{const r=await fetch("/api/services");const d=await r.json();if(!r.ok)throw Error(d.message);select.innerHTML='<option value="">Select service</option>';d.services.forEach(s=>{const o=document.createElement("option");o.value=s.id;o.textContent=`${s.name} (${s.prefix})`;select.appendChild(o)})}catch(e){alert("Unable to load services: "+e.message)}}
async function getJSON(url,options={}){const r=await fetch(url,options);const d=await r.json();if(!r.ok)throw Error(d.message||"Request failed");return d}
async function loadDashboard(){const sid=select.value;if(!sid){reset();return}try{const [c,q,s]=await Promise.all([getJSON(`/api/admin/current?serviceId=${encodeURIComponent(sid)}`),getJSON(`/api/admin/queue?serviceId=${encodeURIComponent(sid)}`),getJSON(`/api/admin/statistics?serviceId=${encodeURIComponent(sid)}`)]);const t=c.currentToken;document.getElementById("currentToken").textContent=t?.tokenNumber||"---";document.getElementById("currentName").textContent=t?.name||"No token";document.getElementById("currentService").textContent=t?.serviceName||"No token currently serving";document.getElementById("queueCount").textContent=`${q.queue.length} waiting`;list.innerHTML="";if(!q.queue.length){list.innerHTML="<p>No customers waiting.</p>"}else q.queue.forEach((t,i)=>{const item=document.createElement("div");item.className="queue-item";const pos=document.createElement("div");pos.className="queue-position";pos.textContent=i+1;const customer=document.createElement("div");customer.className="queue-customer";const strong=document.createElement("strong");strong.textContent=t.tokenNumber;const span=document.createElement("span");span.textContent=t.name;customer.append(strong,span);const st=document.createElement("span");st.className="waiting-status";st.textContent="Waiting";item.append(pos,customer,st);list.appendChild(item)});Object.entries(s.statistics).forEach(([k,v])=>{const el=document.getElementById(k);if(el)el.textContent=v})}catch(e){console.error(e)}}
function reset(){["currentToken","currentName","currentService"].forEach((id,i)=>document.getElementById(id).textContent=["---","No token","Select a service"][i]);list.innerHTML="<p>Select a service to view queue.</p>";document.getElementById("queueCount").textContent="0 waiting";["total","waiting","serving","completed","cancelled","skipped"].forEach(id=>document.getElementById(id).textContent="0")}
document.getElementById("logoutLink").addEventListener("click",async e=>{e.preventDefault();await fetch("/api/auth/logout",{method:"POST"});location.href="/index.html"});
select.addEventListener("change",loadDashboard);document.getElementById("nextBtn").addEventListener("click",async()=>{const sid=select.value;if(!sid)return alert("Please select a service.");try{const d=await getJSON("/api/admin/next",{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({serviceId:sid})});alert(d.message);loadDashboard()}catch(e){alert(e.message)}});loadServices();setInterval(()=>{if(select.value)loadDashboard()},5000);
</script></body></html>
