<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Service Management - QueueFlow</title><link rel="stylesheet" href="style.css"></head><body>
<header class="header"><div class="logo"><div class="logo-box">Q</div><div><h1>QueueFlow</h1><small>Service Management</small></div></div><nav><a href="index.html">Home</a><a href="admin.html">Admin</a><a class="active" href="services.html">Services</a><a href="#" id="logoutLink">Logout</a></nav></header>
<main class="services-page"><div class="section-heading"><small>ADMINISTRATION</small><h1>Manage Services</h1></div><div class="card"><h2>Add New Service</h2><form id="serviceForm" class="service-form"><input id="serviceName" maxlength="60" placeholder="Service name" required><input id="servicePrefix" maxlength="3" placeholder="Prefix e.g. A" required><button class="btn primary" type="submit">Add Service</button></form><p id="message"></p></div><div class="card"><div class="queue-header"><div><small>AVAILABLE SERVICES</small><h2>Services</h2></div></div><div id="serviceList">Loading...</div></div></main>
<script>
const form=document.getElementById("serviceForm"),list=document.getElementById("serviceList"),message=document.getElementById("message");
async function loadServices(){try{const r=await fetch("/api/services"),d=await r.json();if(!r.ok)throw Error(d.message);list.innerHTML="";if(!d.services.length){list.innerHTML="<p>No services available.</p>";return}d.services.forEach(s=>{const item=document.createElement("div");item.className="service-item";const info=document.createElement("div"),strong=document.createElement("strong"),span=document.createElement("span"),del=document.createElement("button");strong.textContent=s.name;span.textContent=`Token Prefix: ${s.prefix}`;info.append(strong,span);del.className="btn danger";del.textContent="Delete";del.onclick=()=>deleteService(s.id);item.append(info,del);list.appendChild(item)})}catch(e){list.textContent="Unable to load services: "+e.message}}
form.addEventListener("submit",async e=>{e.preventDefault();message.textContent="";try{const r=await fetch("/api/services",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:document.getElementById("serviceName").value.trim(),prefix:document.getElementById("servicePrefix").value.trim()})}),d=await r.json();if(!r.ok)throw Error(d.message);message.textContent=d.message;form.reset();loadServices()}catch(e){message.textContent=e.message}});
async function deleteService(id){if(!confirm("Delete this service? Services with token history cannot be deleted."))return;try{const r=await fetch("/api/services/"+encodeURIComponent(id),{method:"DELETE"}),d=await r.json();if(!r.ok)throw Error(d.message);message.textContent=d.message;loadServices()}catch(e){message.textContent=e.message}}
loadServices();
document.getElementById("logoutLink").addEventListener("click",async e=>{e.preventDefault();await fetch("/api/auth/logout",{method:"POST"});location.href="/index.html"});
</script></body></html>
