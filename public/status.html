<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Check Token Status - QueueFlow</title><link rel="stylesheet" href="style.css"></head><body>
<header class="header"><div class="logo"><div class="logo-box">Q</div><div><h1>QueueFlow</h1><small>Digital Queue Management</small></div></div><nav><a href="index.html">Home</a><a class="active" href="status.html">Check Status</a><a href="login.html">Admin Login</a></nav></header>
<main class="status-page"><div class="card status-search"><small>QUEUE STATUS</small><h1>Check Your Token</h1><p>Enter your token number to see your current position.</p><div class="search-box"><input id="tokenInput" maxlength="10" placeholder="Example: A001" autocomplete="off"><button class="btn primary" id="checkBtn">Check</button></div><p id="error"></p></div>
<div id="result" class="card status-result hidden"><small>TOKEN DETAILS</small><div class="status-token" id="tokenNumber">---</div><div class="status-grid"><div><span>Name</span><strong id="name">-</strong></div><div><span>Service</span><strong id="service">-</strong></div><div><span>Status</span><strong id="tokenStatus">-</strong></div><div><span>People Ahead</span><strong id="ahead">0</strong></div></div><div class="queue-message" id="queueMessage"></div></div></main>
<script>
const input=document.getElementById("tokenInput"),error=document.getElementById("error"),result=document.getElementById("result");
async function checkStatus(){const number=input.value.trim();if(!number){error.textContent="Please enter your token number.";result.classList.add("hidden");return}try{const r=await fetch("/api/tokens/number/"+encodeURIComponent(number));const d=await r.json();if(!r.ok)throw new Error(d.message||"Token not found");error.textContent="";result.classList.remove("hidden");const t=d.token;document.getElementById("tokenNumber").textContent=t.tokenNumber;document.getElementById("name").textContent=t.name;document.getElementById("service").textContent=t.serviceName;document.getElementById("tokenStatus").textContent=t.status.charAt(0).toUpperCase()+t.status.slice(1);document.getElementById("ahead").textContent=d.peopleAhead;const m=document.getElementById("queueMessage");if(t.status==="waiting")m.textContent=d.peopleAhead===0?"You are next! Please be ready.":`${d.peopleAhead} people are ahead of you.`;else if(t.status==="serving")m.textContent="It is your turn! Please proceed to the counter.";else if(t.status==="completed")m.textContent="Your service has been completed.";else if(t.status==="cancelled")m.textContent="This token has been cancelled.";else m.textContent="This token has been skipped."}catch(e){error.textContent=e.message;result.classList.add("hidden")}}
document.getElementById("checkBtn").addEventListener("click",checkStatus);input.addEventListener("keydown",e=>{if(e.key==="Enter")checkStatus()});
const params=new URLSearchParams(location.search);if(params.get("token")){input.value=params.get("token");checkStatus()}
</script></body></html>
